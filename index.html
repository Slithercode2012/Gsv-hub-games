<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Triangoli</title>
    <meta name="description" content="Triangoli" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #111827;
        color: #f9fafb;
      }
      .card {
        text-align: center;
        padding: 3rem 4rem;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.06);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 4rem);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Triangoli</h1>
    </div>
  </body>
</html>
